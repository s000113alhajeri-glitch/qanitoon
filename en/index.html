<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6f9e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Qanitoon — Umrah, Hajj, Adhkar & Quran</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="sp-frame">
    <div class="kaabaWrap">
      <div class="shadow"></div>
      <div class="kaaba">
        <div class="f fr"><i class="belt"></i><i class="studs"></i><i class="curtain"></i><i class="base"></i></div>
        <div class="f bk"><i class="belt"></i><i class="studs"></i><i class="curtain"></i><i class="base"></i></div>
        <div class="f lf"><i class="belt"></i><i class="studs"></i><i class="curtain"></i><i class="base"></i></div>
        <div class="f rt"><i class="belt"></i><i class="studs"></i><i class="curtain"></i><i class="base"></i></div>
        <div class="f tp"></div>
      </div>
    </div>
    <div class="sp-name">قانتون</div>
    <div class="sp-rule"></div>
    <div class="sp-ayah">﴿كُلٌّ لَّهُ قَانِتُونَ﴾</div>
    <div class="sp-ref">البقرة ١١٦</div>
    <div class="sp-mean">القانتون: الخاضعون الخاشعون لله المطيعون له، وقيل: المصلّون — تفسير ابن كثير والطبري</div>
  </div>
</div>
<div id="sky">
  <canvas id="stars"></canvas>
  <div id="sun"></div>
  <div id="moon"><canvas id="moonc" width="160" height="160"></canvas></div>
  <canvas id="rain"></canvas>
  <canvas id="life"></canvas>
  <div id="clouds">
    <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
    <div class="cloud c4"></div><div class="cloud c5"></div>
  </div>
  <div id="horizon"></div>
</div>
<header>
  <button id="avatar" class="avatar" aria-label="ملفي والإعدادات">؟</button>
  <h1 id="hTitle">قانتون</h1>
  <button id="langBtn" class="langBtn" aria-label="Language">English</button>
  <div class="sub" id="hSub">يعمل بدون إنترنت</div>
  <div id="skyName" class="skyname"></div>
  <div id="pstrip" class="pstrip"></div>
</header>

<main>
  <div id="summary"></div>
  <section id="v-home"></section>
  <section id="v-umrah" class="hidden"></section>
  <section id="v-hajj" class="hidden"></section>
  <section id="v-quran" class="hidden"></section>
  <section id="v-adhkar" class="hidden"></section>
  <section id="v-tadabbur" class="hidden"></section>
  <section id="v-time" class="hidden"></section>
  <section id="v-settings" class="hidden"></section>
</main>

<nav id="nav">
  <button data-v="home" class="on"><i data-ico="home"></i>الرئيسية</button>
  <button data-v="umrah"><i data-ico="kaaba"></i>العمرة</button>
  <button data-v="hajj"><i data-ico="hajj"></i>الحج</button>
  <button data-v="quran"><i data-ico="quran"></i>المصحف</button>
  <button data-v="adhkar"><i data-ico="beads"></i>الأذكار</button>
  <button data-v="tadabbur"><i data-ico="book"></i>التدبّر</button>
  <button data-v="time"><i data-ico="moon"></i>رمضان</button>
</nav>
<button id="helpBtn" class="helpBtn" aria-label="مساعدة">؟</button>

<script src="i18n.js"></script>
<script src="en_extra.js"></script>
<script src="tr_en.js"></script>
<script src="quran_en.js"></script>
<script src="icons.js"></script>
<script src="quran.js"></script>
<script src="manasik.js"></script>
<script src="content.js"></script>
<script src="situations.js"></script>
<script src="hisn.js"></script>
<script src="islambook.js"></script>
<script src="names.js"></script>
<script src="spots.js"></script>
<script src="nature.js"></script>
<script src="qurandua.js"></script>
<script src="duacheck.js"></script>
<script src="jadwal.js"></script>
<script src="app.js"></script>
<script data-goatcounter="https://qanitoon-en.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
