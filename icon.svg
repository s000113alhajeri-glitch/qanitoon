<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4e74"/>
      <stop offset="55%" stop-color="#123c5c"/>
      <stop offset="100%" stop-color="#0a2639"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#151515"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dd9e"/>
      <stop offset="45%" stop-color="#d6b46e"/>
      <stop offset="100%" stop-color="#a8813c"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <circle cx="256" cy="300" r="196" fill="#ffffff" opacity=".05"/>
  <circle cx="256" cy="300" r="150" fill="#ffffff" opacity=".05"/>
  <circle cx="108" cy="104" r="4" fill="#fff" opacity=".6"/>
  <circle cx="404" cy="86" r="3.4" fill="#fff" opacity=".5"/>
  <circle cx="356" cy="140" r="2.6" fill="#fff" opacity=".45"/>
  <circle cx="150" cy="168" r="2.6" fill="#fff" opacity=".4"/>

  <!-- الكعبة: واجهة وجانب -->
  <path d="M150 190l106-34 106 34v214l-106 20-106-20z" fill="url(#face)"/>
  <path d="M256 156l106 34v214l-106 20z" fill="url(#side)"/>
  <path d="M150 190l106-34 106 34-106 30z" fill="#232323"/>

  <!-- الحزام الذهبي -->
  <path d="M150 268l106 28 106-28v34l-106 28-106-28z" fill="url(#gold)"/>
  <path d="M150 190l106-34 106 34-106 30z" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linejoin="round" opacity=".85"/>

  <!-- الباب -->
  <rect x="288" y="318" width="44" height="80" rx="5" fill="url(#gold)" opacity=".92"/>
  <rect x="296" y="329" width="28" height="58" rx="3" fill="none" stroke="#8e6a2c" stroke-width="3" opacity=".7"/>

  <!-- الحجر الأسود عند الركن -->
  <ellipse cx="156" cy="318" rx="9" ry="13" fill="url(#gold)" opacity=".9"/>

  <!-- أرضية المطاف -->
  <ellipse cx="256" cy="438" rx="176" ry="26" fill="#ffffff" opacity=".12"/>
</svg>
